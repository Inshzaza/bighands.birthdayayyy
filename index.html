<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday 🎉</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- ✨ Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    /* 💖 Heading */
    .heading {
      font-family: 'Dancing Script', cursive;
      font-size: 38px;
      color: #d63384;
    }

    /* 😎 Subtext */
    .subtext {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      color: #444;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 0 5px rgba(255, 105, 180, 0.4);
    }

    /* 📸 Polaroids */
    .polaroid {
      background: white;
      padding: 10px 10px 25px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 140px;
      border-radius: 0;
      animation: floatPhoto 4s ease-in-out infinite;
    }

    .polaroid img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .tilt1 { transform: rotate(-6deg); animation-delay: 0s; }
    .tilt2 { transform: rotate(4deg); animation-delay: 1s; }
    .tilt3 { transform: rotate(-3deg); animation-delay: 2s; }

    @keyframes floatPhoto {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .caption {
      margin-top: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #444;
    }

    /* 🎈 Balloons */
    .balloon {
      position: absolute;
      bottom: -120px;
      font-size: 35px;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh);
        opacity: 0;
      }
    }

    /* ✨ Sparkles */
    .sparkle {
      position: absolute;
      color: rgba(255,255,255,0.8);
      animation: sparkleMove 3s linear infinite;
    }

    @keyframes sparkleMove {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

  <!-- 🎈 Balloons -->
  <div id="balloons"></div>

  <!-- ✨ Sparkles -->
  <div id="sparkles"></div>

  <div class="bg-pink-100 shadow-2xl rounded-2xl p-8 sm:p-10 max-w-lg w-full text-center relative z-10">

    <h1 class="heading mb-6">
      Happy Birthday Ali Raza 🎂🎈
    </h1>

    <!-- 📸 Polaroids -->
    <div class="flex justify-center gap-5 mb-6">

      <div class="polaroid tilt1">
        <img src="img1.jpg">
        <div class="caption">OG Cutie</div>
      </div>

      <div class="polaroid tilt2">
        <img src="img2.jpg">
        <div class="caption">Thirst Trap</div>
      </div>

      <div class="polaroid tilt3">
        <img src="img3.jpg">
        <div class="caption">Big Guy</div>
      </div>

    </div>

    <p class="subtext mb-4">
      Happiest Birthday to the Hottest Man Alive 🔥🎂
    </p>

    <!-- 🎵 Music -->
    <audio controls loop class="w-full mb-4 rounded-lg">
      <source src="romantic.mp3" type="audio/mpeg">
    </audio>

    <button onclick="celebrate()" class="mt-4 px-6 py-3 bg-pink-500 text-white rounded-xl shadow hover:bg-pink-600 transition">
      Click for a Surprise 🎊
    </button>

    <p id="surprise" class="mt-4 text-lg font-semibold text-purple-600 hidden">
      You are amazing! Have the best birthday ever! 💖
    </p>

    <button onclick="goNext()" class="mt-4 px-6 py-2 bg-purple-600 text-white rounded-lg">
      Next ➡️
    </button>

  </div>

  <script>
    function celebrate() {
      document.getElementById('surprise').classList.remove('hidden');

      confetti({
        particleCount: 150,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    function goNext() {
      window.location.href = "page2.html";
    }

    // 🎈 Balloons (NO strings)
    function createBalloon() {
      const balloon = document.createElement("div");
      balloon.classList.add("balloon");

      const emojis = ["🎈","🎈","💖","🎀","✨"];
      balloon.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];

      balloon.style.left = Math.random() * 100 + "vw";
      balloon.style.animationDuration = (Math.random() * 3 + 5) + "s";

      document.body.appendChild(balloon);

      setTimeout(() => balloon.remove(), 8000);
    }

    setInterval(createBalloon, 600);

    // ✨ Sparkles
    function createSparkle() {
      const sparkle = document.createElement("div");
      sparkle.classList.add("sparkle");
      sparkle.innerHTML = "✨";

      sparkle.style.left = Math.random() * 100 + "vw";
      sparkle.style.fontSize = (Math.random() * 10 + 10) + "px";
      sparkle.style.animationDuration = (Math.random() * 2 + 2) + "s";

      document.body.appendChild(sparkle);

      setTimeout(() => sparkle.remove(), 4000);
    }

    setInterval(createSparkle, 300);
  </script>

</body>
</html>
